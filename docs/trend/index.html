.pa{display:inline-flex;align-items:center;gap:4px}

window.addEventListener('DOMContentLoaded',function(){
  document.getElementById('date').textContent=new Date().toLocaleDateString('zh-CN');
  renderNav();
  renderStats();renderOverview();
});

function renderNav(){
  var el=document.getElementById('nav'),h='';
  for(var i=0;i<NAV.length;i++) h+='<div class="ni'+(i===0?' on':'')+'" data-s="'+NAV[i].id+'"><div class="dt"></div><span>'+NAV[i].label+'</span></div>';
  el.innerHTML=h;
  var items=el.querySelectorAll('.ni');
  for(var i=0;i<items.length;i++){
    items[i].addEventListener('click',function(){
      for(var j=0;j<items.length;j++) items[j].classList.remove('on');
      this.classList.add('on');
      var secs=document.querySelectorAll('.sec');
      for(var j=0;j<secs.length;j++) secs[j].classList.remove('on');
      var s=this.getAttribute('data-s');
      document.getElementById('sec-'+s).classList.add('on');
      if(s==='radar')renderRadar();
      if(s==='timeline')renderTimeline();
      if(s==='resonance')renderResonance();
      if(s==='predictions')renderPredictions();
      if(s==='news')renderNews();
    });
  }
}

function renderStats(){
  if(!TD.length)return;
  var avg=0,em=0,gr=0,ar=0;
  for(var i=0;i<TD.length;i++){avg+=TD[i].score;if(TD[i].lifecycle==='emerging')em++;if(TD[i].lifecycle==='growth')gr++;ar+=TD[i].resonance_score;}
  avg=Math.round(avg/TD.length);ar=Math.round(ar/TD.length);
  document.getElementById('stats').innerHTML=
    '<div class="sc"><div class="lb">平均趋势分</div><div class="vl">'+avg+'</div><div class="ch">&#9650; 8.2</div></div>'+
    '<div class="sc"><div class="lb">萌芽期</div><div class="vl">'+em+'</div><div class="ch">新兴机会</div></div>'+
    '<div class="sc"><div class="lb">增长期</div><div class="vl">'+gr+'</div><div class="ch">稳健增长</div></div>'+
    '<div class="sc"><div class="lb">平均共振</div><div class="vl">'+ar+'</div><div class="ch">多维验证</div></div>';
  document.getElementById('tcnt').textContent=TD.length;
}

function renderOverview(){
  var el=document.getElementById('tgrid');
  if(!TD.length){el.innerHTML='<p style="color:var(--text3)">暂无数据</p>';return;}
  var h='';
  for(var i=0;i<TD.length;i++){
    var t=TD[i],lc=LCC[t.lifecycle]||'gr';
    h+='<div class="tc" data-id="'+t.id+'">';
    h+='<div class="tc-hd"><div class="tc-nm">'+t.name+'</div><div class="tc-bd bd-'+lc+'">'+(LC[t.lifecycle]||t.lifecycle)+'</div></div>';
    h+='<div class="tc-sc" style="color:'+sc(t.score)+'">'+t.score+'</div>';
    h+='<div class="tc-vl">增速 '+(t.velocity>0?'+':'')+t.velocity+'%/月 &middot; 共振 '+t.resonance_score+'</div>';
    h+='<div class="tc-cl">';
    var cp=t.color_palette||[];
    for(var j=0;j<cp.length&&j<5;j++) h+='<div class="cd" style="background:'+cp[j]+'"></div>';
    h+='</div><div class="tc-sig">';
    var sigs=t.signals||{},keys=Object.keys(sigs);
    for(var j=0;j<keys.length;j++){var k=keys[j],v=sigs[k];
      h+='<div class="sig-r"><span class="sn">'+(DIM[k]||k)+'</span><div class="sbr"><div class="sfl" style="width:'+v+'%;background:'+sc(v)+'"></div></div><span class="sv">'+v+'</span></div>';}
    h+='</div></div>';
  }
  el.innerHTML=h;
  var cards=el.querySelectorAll('.tc');
  for(var i=0;i<cards.length;i++){
    cards[i].addEventListener('click',function(){
      var self=this,tid=this.getAttribute('data-id');
      var d=null;for(var k=0;k<TD.length;k++)if(TD[k].id===tid)d=TD[k];
      if(!d)return;
      var tt=document.getElementById('ttip'),r=self.getBoundingClientRect();
      tt.innerHTML='<div class="tn">'+d.name+' ('+d.name_en+')</div><div class="td">'+(d.category||'')+'</div><div class="tr">增速 '+d.velocity+'%/月 · 共振 '+d.resonance_score+'</div>';
      tt.style.display='block';tt.style.left=Math.min(r.right+10,window.innerWidth-320)+'px';tt.style.top=r.top+'px';
      setTimeout(function(){tt.style.display='none'},5000);
    });
  }
}

function renderRadar(){
  if(!Object.keys(RD).length||typeof echarts==='undefined')return;
  var ch=echarts.init(document.getElementById('rch'),'dark');
  var dims=Object.keys(RD),ind=[],vals=[];
  for(var i=0;i<dims.length;i++){ind.push({name:RD[dims[i]].name,max:100});vals.push(RD[dims[i]].avg_score);}
  ch.setOption({backgroundColor:'transparent',radar:{indicator:ind,shape:'polygon',axisLine:{lineStyle:{color:'#252540'}},splitLine:{lineStyle:{color:'#1a1a2e'}},splitArea:{areaStyle:{color:['rgba(201,169,110,.02)','rgba(201,169,110,.05)']}},axisName:{color:'#a09b92',fontSize:11}},series:[{type:'radar',data:[{value:vals,name:'平均信号',areaStyle:{color:'rgba(201,169,110,.15)'},lineStyle:{color:'#c9a96e',width:2},itemStyle:{color:'#c9a96e'}}]}],tooltip:{trigger:'item'}});
  var h='';
  for(var i=0;i<dims.length;i++){var v=RD[dims[i]];
    h+='<div style="padding:12px 0;border-bottom:1px solid var(--border)"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="font-size:13px;font-weight:600">'+v.name+'</span><span style="font-size:12px;color:var(--accent)">'+v.avg_score+'</span></div><div style="font-size:11px;color:var(--text2);margin-bottom:4px">最强: '+v.max_trend+' ('+v.max_score+')</div><div style="height:4px;background:var(--bg);border-radius:2px;overflow:hidden"><div style="width:'+v.avg_score+'%;height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:2px"></div></div></div>';}
  document.getElementById('rdet').innerHTML=h;
}

function renderTimeline(){
  if(!TD.length||typeof echarts==='undefined')return;
  var ch=echarts.init(document.getElementById('tch'),'dark');
  var cols=['#c9a96e','#4ade80','#60a5fa','#f87171','#a78bfa','#fb923c','#22d3ee','#f472b6'];
  var series=[],months=[];
  for(var i=0;i<TD.length&&i<8;i++){
    var d=TL_DATA[TD[i].id];
    if(!d)continue;
    if(i===0)months=d.months||[];
    series.push({name:TD[i].name,type:'line',smooth:true,symbol:'circle',symbolSize:4,lineStyle:{width:2},itemStyle:{color:cols[i%cols.length]},data:d.data||[]});
  }
  drawTL(ch,months,series);
  var lc=echarts.init(document.getElementById('lch'),'dark');
  var ld=[{name:'萌芽期',value:0,itemStyle:{color:'#60a5fa'}},{name:'增长期',value:0,itemStyle:{color:'#4ade80'}},{name:'成熟期',value:0,itemStyle:{color:'#fb923c'}},{name:'衰退期',value:0,itemStyle:{color:'#f87171'}}];
  for(var i=0;i<TD.length;i++){if(TD[i].lifecycle==='emerging')ld[0].value++;else if(TD[i].lifecycle==='growth')ld[1].value++;else if(TD[i].lifecycle==='mature')ld[2].value++;else if(TD[i].lifecycle==='declining')ld[3].value++;}
  lc.setOption({backgroundColor:'transparent',tooltip:{trigger:'item'},series:[{type:'pie',radius:['45%','70%'],label:{color:'#a09b92',fontSize:12},data:ld}]});
}
function drawTL(ch,months,series){ch.setOption({backgroundColor:'transparent',tooltip:{trigger:'axis'},legend:{top:0,textStyle:{color:'#a09b92',fontSize:11},itemWidth:16,itemHeight:2},grid:{top:40,right:20,bottom:30,left:40},xAxis:{type:'category',data:months,boundaryGap:false,axisLine:{lineStyle:{color:'#1a1a2e'}},axisLabel:{color:'#6b6660',fontSize:10,rotate:30}},yAxis:{type:'value',min:0,max:100,axisLine:{show:false},splitLine:{lineStyle:{color:'#1a1a2e'}},axisLabel:{color:'#6b6660',fontSize:10}},series:series});}

function renderResonance(){
  var el=document.getElementById('rlist'),h='',list=RC||[];
  for(var i=0;i<list.length&&i<10;i++){var r=list[i];
    h+='<div class="ri"><div class="rn">'+r.trend_a+' <span class="arr">&harr;</span> '+r.trend_b+'</div><div class="rb"><div class="rf" style="width:'+(r.resonance*100)+'%"></div></div><div class="rv">'+Math.round(r.resonance*100)+'%</div></div>';}
  el.innerHTML=h;
  if(typeof echarts==='undefined')return;
  var hm=echarts.init(document.getElementById('hmch'),'dark');
  var names=[];for(var i=0;i<TD.length;i++)names.push(TD[i].name);
  var hd=[];
  for(var i=0;i<TD.length;i++)for(var j=0;j<TD.length;j++){var v=0;
    if(i===j)v=100;else{for(var k=0;k<list.length;k++){if((list[k].trend_a===TD[i].name&&list[k].trend_b===TD[j].name)||(list[k].trend_a===TD[j].name&&list[k].trend_b===TD[i].name)){v=Math.round(list[k].resonance*100);break;}}}
    hd.push([j,i,v]);}
  hm.setOption({backgroundColor:'transparent',tooltip:{formatter:function(p){return names[p.data[0]]+' &harr; '+names[p.data[1]]+'<br/>共振: '+p.data[2]+'%'}},grid:{top:10,right:10,bottom:60,left:80},xAxis:{type:'category',data:names,axisLabel:{color:'#6b6660',fontSize:10,rotate:30}},yAxis:{type:'category',data:names,axisLabel:{color:'#6b6660',fontSize:10}},visualMap:{min:0,max:100,show:true,orient:'horizontal',bottom:0,left:'center',inRange:{color:['#0d0d14','#1a1a2e','#2d2520','#c9a96e']},textStyle:{color:'#6b6660',fontSize:10}},series:[{type:'heatmap',data:hd,label:{show:true,color:'#a09b92',fontSize:9},emphasis:{itemStyle:{shadowBlur:10,shadowColor:'rgba(201,169,110,.5)'}}}]});
}

function renderPredictions(){
  var list=PD||[],h='<table class="pt"><thead><tr><th>趋势</th><th>当前</th><th>6月后</th><th>变化</th><th>置信度</th><th>阶段</th><th>峰值</th></tr></thead><tbody>';
  for(var i=0;i<list.length;i++){var p=list[i],d=p.predicted_score-p.current_score,cc=p.confidence>80?'var(--green)':p.confidence>60?'var(--orange)':'var(--red)',lc=LCC[p.lifecycle]||'gr';
    h+='<tr><td style="font-weight:600">'+p.name+'</td><td>'+p.current_score+'</td><td style="font-weight:700;color:var(--accent)">'+p.predicted_score+'</td><td><span class="pa '+(d>=0?'up':'dn')+'">'+(d>=0?'&#9650;':'&#9660;')+' '+(d>=0?'+':'')+d.toFixed(1)+'</span></td><td><span style="color:'+cc+'">'+p.confidence+'%</span></td><td><span class="lt '+lc+'">'+LC[p.lifecycle]+'</span></td><td style="color:var(--text2)">'+p.peak_month+'</td></tr>';}
  h+='</tbody></table>';document.getElementById('ptab').innerHTML=h;
  if(typeof echarts==='undefined')return;
  var pc=echarts.init(document.getElementById('pch'),'dark');
  var cols=['#c9a96e','#4ade80','#60a5fa','#f87171','#a78bfa','#fb923c','#22d3ee','#f472b6'],names=[],cur=[],pred=[];
  for(var i=0;i<list.length;i++){names.push(list[i].name);cur.push({value:list[i].current_score,itemStyle:{color:cols[i%cols.length],opacity:.5}});pred.push({value:list[i].predicted_score,itemStyle:{color:cols[i%cols.length]}});}
  pc.setOption({backgroundColor:'transparent',tooltip:{trigger:'axis'},legend:{top:0,textStyle:{color:'#a09b92',fontSize:11},itemWidth:16,itemHeight:2},grid:{top:40,right:20,bottom:30,left:40},xAxis:{type:'category',data:names,axisLabel:{color:'#6b6660',fontSize:10,rotate:20}},yAxis:{type:'value',min:50,max:100,axisLine:{show:false},splitLine:{lineStyle:{color:'#1a1a2e'}},axisLabel:{color:'#6b6660',fontSize:10}},series:[{name:'当前分',type:'bar',barWidth:20,data:cur},{name:'6月后',type:'bar',barWidth:20,data:pred}]});
}

function renderNews(){
  var list=ND||[],h='';
  for(var i=0;i<list.length;i++){var n=list[i],cls=n.impact==='high'?'hi':n.impact==='medium'?'md':'lo';
    h+='<div class="ni-item"><div class="nd '+cls+'"></div><div class="nc"><div class="nt">'+n.title+'</div><div class="nm">'+n.source+' &middot; '+n.date+'</div></div></div>';}
  document.getElementById('nlist').innerHTML=h;
}
