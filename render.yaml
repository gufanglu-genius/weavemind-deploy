services:
  - type: web
    name: weavemind
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"